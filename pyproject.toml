[project]
name = "coach-gimnasio"
version = "0.1.0"
description = "Coach de gimnasio con IA"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.160.0",
    "uvicorn==0.54.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "langgraph==1.2.16",
    "langgraph-checkpoint-redis==0.5.2",
    "langchain-core==1.6.3",
    "langchain-google-genai==4.4.0",
    "sqlalchemy[asyncio]==2.1.1",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "qdrant-client==1.20.0",
    "sentence-transformers==6.1.0",
    "fastembed==0.9.0",
    "httpx==0.28.1",
    "redis==8.1.0",
    "arize-phoenix-otel==0.17.2",
    "openinference-instrumentation-langchain==0.1.79",
    "opentelemetry-sdk==1.45.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Las pruebas de sistema (stack real + Gemini) no corren por defecto:
# ejecutarlas con `pytest tests/sistema -m sistema` (el ultimo -m sustituye a este).
addopts = "-m 'not sistema'"
markers = [
    "integracion: pruebas de integracion que requieren servicios externos (Postgres, Qdrant, Redis)",
    "sistema: pruebas de extremo a extremo con docker compose y Gemini real (trazas en Phoenix)",
]
