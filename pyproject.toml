[project]
name = "coach-gimnasio"
version = "0.1.0"
description = "Coach de gimnasio con IA"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.160.0",
    "uvicorn==0.54.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "langgraph==1.2.16",
    "langgraph-checkpoint-redis==0.5.2",
    "langchain-core==1.6.3",
    "langchain-google-genai==4.4.0",
    "sqlalchemy[asyncio]==2.1.1",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "qdrant-client==1.20.0",
    "sentence-transformers==6.1.0",
    "fastembed==0.9.0",
    "httpx==0.28.1",
    "redis==8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integracion: pruebas de integracion que requieren servicios externos (Postgres, Qdrant, Redis)",
]
