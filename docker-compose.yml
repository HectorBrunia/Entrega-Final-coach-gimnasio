# Un solo comando desde un clon limpio: docker compose up -d   (con o sin .env)
#
# Orden de arranque: postgres, redis y qdrant (con healthcheck) -> init (migraciones de Alembic e
# ingesta idempotente del catalogo y las guias en Qdrant; termina y sale con 0) -> api.
# Sin .env (o sin GOOGLE_API_KEY) todo arranca igual: /health, /docs, usuarios, perfil, entrenos
# y rutinas funcionan, y /chat y /hitl responden 503 explicando que falta configurar la clave.
# Los puertos del host se pueden cambiar con API_PORT, POSTGRES_PORT, REDIS_PORT, QDRANT_PORT y
# PHOENIX_PORT (p. ej. si ya estan ocupados).

# Configuracion comun de api e init (misma imagen; solo api la construye, ver init).
# COACH_IMAGE permite otro nombre de imagen (p. ej. para probar un clon sin pisar la imagen local).
x-coach-app: &coach-app
  image: ${COACH_IMAGE:-coach-gimnasio-api:0.1.0}
  # .env es opcional; COACH_ENV_FILE permite apuntar a otro archivo.
  env_file:
    - path: ${COACH_ENV_FILE:-.env}
      required: false
  # Dentro de la red de compose los servicios se alcanzan por su nombre, no por localhost:
  # estas variables sustituyen a las del .env solo dentro del contenedor.
  environment:
    DATABASE_URL: postgresql+asyncpg://coach:coach@postgres:5432/coach
    REDIS_URL: redis://redis:6379/0
    QDRANT_URL: http://qdrant:6333
    PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
    CATALOGO_PATH: data/catalogo/exercises.json
    GUIAS_DIR: data/guias
  volumes:
    - modelos_cache:/cache

services:
  # Tarea de una sola vez: migraciones + ingesta (idempotentes; repetirlas no duplica nada).
  # La primera vez descarga los modelos de embeddings (cache en el volumen modelos_cache).
  # Si la ingesta falla (p. ej. sin red para descargar los modelos) se avisa y la api arranca
  # igual: el RAG queda vacio, pero el resto funciona. Un fallo de las migraciones si detiene.
  init:
    <<: *coach-app
    # Usa la imagen que construye api (compose construye antes de crear contenedores). Si los
    # dos servicios la construyeran, en Windows compose exporta la misma imagen dos veces a la
    # vez y falla; por eso init nunca la construye ni la descarga.
    pull_policy: never
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        (python scripts/ingerir.py ||
        echo "AVISO: la ingesta en Qdrant fallo; la API arranca sin RAG. Reintentar con: docker compose run --rm init")
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  api:
    <<: *coach-app
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      phoenix:
        condition: service_started

  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach
      POSTGRES_DB: coach
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach -d coach"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis/redis-stack:7.4.0-v3
    environment:
      # AOF: los checkpoints del grafo sobreviven a reinicios de Redis (el entrypoint lee REDIS_ARGS)
      REDIS_ARGS: "--appendonly yes"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      # Volumen propio de la serie 1.20: el almacenamiento de qdrant v1.12 no se puede abrir con
      # v1.20 (el servidor no arranca). El contenido es derivado: el servicio init lo vuelve a ingerir.
      - qdrant_data_v1_20:/qdrant/storage
    healthcheck:
      # la imagen de Qdrant no trae curl ni wget: se consulta /healthz con bash y /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && grep -q passed <&3"]
      interval: 5s
      timeout: 3s
      retries: 20

  phoenix:
    image: arizephoenix/phoenix:version-6.0.0
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    ports:
      - "${PHOENIX_PORT:-6006}:6006"
    volumes:
      - phoenix_data:/mnt/data

volumes:
  postgres_data:
  qdrant_data_v1_20:
  redis_data:
  phoenix_data:
  modelos_cache:
