services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach
      POSTGRES_DB: coach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

  redis:
    image: redis/redis-stack:7.4.0-v3
    environment:
      # AOF: los checkpoints del grafo sobreviven a reinicios de Redis (el entrypoint lee REDIS_ARGS)
      REDIS_ARGS: "--appendonly yes"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  phoenix:
    image: arizephoenix/phoenix:version-6.0.0
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    ports:
      - "6006:6006"
    volumes:
      - phoenix_data:/mnt/data

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  phoenix_data:
